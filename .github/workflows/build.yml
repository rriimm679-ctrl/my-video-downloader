name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer<1.6.0" "cython<3.0.0" kivy

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Sign APK for MIUI/Redmi
      run: |
        sudo apt-get install -y apksigner zipalign
        cd bin/
        APK_FILE=$(ls *.apk)
        zipalign -v 4 $APK_FILE aligned.apk
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android aligned.apk
        mv aligned.apk $APK_FILE

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
        
