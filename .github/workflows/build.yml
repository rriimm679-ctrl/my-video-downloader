name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip android-sdk-build-tools

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer<1.6.0" "cython<3.0.0" kivy

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Sign APK with Key
      run: |
        cd bin/
        APK_FILE=$(ls *.apk)
        keytool -genkeypair -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=App,OU=Dev,O=Dev,L=City,S=State,C=US"
        apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 $APK_FILE

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
